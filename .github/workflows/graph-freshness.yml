name: graph-freshness

# Гейт актуальности графа знаний.
#
# Граф в graphify-out/ отслеживается в git и служит первой точкой входа для
# агентов. Устаревший граф, попавший в main, наследуется каждой следующей
# сессией уже как «истина из репозитория», и агент уверенно отвечает по нему
# неверно. Локальный post-commit hook пересобирает граф в фоне и о своих
# отказах сообщает только в лог, который никто не читает, — поэтому расхождение
# ловится здесь, на пути в main.
#
# Проверка не пересобирает граф: она сравнивает состав корпуса с manifest.json
# и время последнего коммита с правкой кода со временем последнего коммита,
# тронувшего graphify-out/graph.json. Правится расхождение локально командой
# `/graphify . --update` с последующим коммитом артефактов графа.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  freshness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Проверка сравнивает даты коммитов, поэтому нужна полная история:
          # при shallow clone git log по путям вернёт пустоту и гейт замолчит.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Граф покрывает текущий код
        run: python tools/graph_freshness.py --ci
