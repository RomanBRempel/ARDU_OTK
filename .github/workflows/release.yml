name: release

# Релиз выпускается пушем тега вида v1.2.3.
# Ничего больше делать не нужно: приложение на цеховых ПК само увидит
# новый GitHub Release и обновится.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Версия из тега
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Тег '${{ github.ref_name }}' не является SemVer. Ожидается v1.2.3."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      # Версия CLI обязана совпадать с версией пакета Velopack в csproj:
      # разные версии дают несовместимые метаданные релиза.
      - name: Установить Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Сборка
        run: >
          dotnet publish ARDU_OTK/ARDU_OTK.csproj
          -c Release
          -r win-x64
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # Дельты считаются относительно предыдущих релизов, поэтому их надо
      # положить рядом. На самом первом релизе скачивать нечего — шаг
      # ожидаемо падает и не должен ронять сборку.
      - name: Загрузить предыдущие релизы для расчёта дельт
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases

      - name: Упаковать установщик
        run: >
          vpk pack
          --packId ARDU_OTK
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe ARDU_OTK.exe
          --packTitle "ARDU OTK"
          --packAuthors ARDU
          --icon ARDU_OTK/Assets/AppIcon.ico
          --outputDir releases

      - name: Опубликовать GitHub Release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --tag ${{ github.ref_name }}
          --releaseName "ARDU OTK ${{ steps.version.outputs.value }}"
          --publish true
